services:
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ""
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set CLERK_PUBLISHABLE_KEY}
    depends_on:
      - api
    ports:
      - "8080:80"

  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://studyos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/studyos
      CHROMA_URL: http://chroma:8000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}
    volumes:
      - uploaded_documents:/app/documents

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studyos
      POSTGRES_USER: studyos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyos -d studyos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma_data:/data

volumes:
  chroma_data:
  postgres_data:
  uploaded_documents:
